[[redirects]]
  from = "/api/dev"
  to = "/.netlify/functions/dev-api"
  status = 200
  force = true

[[redirects]]
  from = "/dev"
  to = "/dev.html"
  status = 200
  force = true

[[headers]]
  for = "/dev.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
